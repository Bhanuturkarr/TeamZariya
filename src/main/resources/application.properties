spring.application.name=ai-tutor-backend
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aitutor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aitutor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.material-storage.directory=./data/materials
app.materials.max-file-size-bytes=10485760
app.materials.chunk-size=1500
app.ai.provider=${AI_PROVIDER:mock}
app.learning.mastery-threshold=${LEARNING_MASTERY_THRESHOLD:80}
app.learning.review-threshold=${LEARNING_REVIEW_THRESHOLD:60}
app.security.bootstrap.password=${AITUTOR_BOOTSTRAP_PASSWORD:LocalDevOnlyChangeMe123!}
springdoc.swagger-ui.path=/swagger-ui.html
spring.ai.model.chat=${AI_PROVIDER:mock}
spring.ai.model.embedding=${AI_PROVIDER:mock}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-5-mini}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.dimensions=1536
