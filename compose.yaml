services:
  database:
    image: pgvector/pgvector:pg16
    container_name: aitutor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitutor}
      POSTGRES_USER: ${POSTGRES_USER:-aitutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aitutor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitutor} -d ${POSTGRES_DB:-aitutor}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aitutor-postgres-data:
